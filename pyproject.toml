[project]
name = "modo-energy"
version = "0.1.0"
description = "Demo client for the Modo Energy API and an ERCOT day-ahead arbitrage model"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipympl>=0.10.0",
    "matplotlib>=3.10.9",
    "pandas>=2.3.3",
    "pandera>=0.31.1",
    "prophet>=1.3.0",
    "python-dotenv>=1.1",
    "requests>=2.34.2",
    "requests-cache>=1.3.2",
    "scipy>=1.17.1",
    "snowflake-connector-python[pandas]==4.4.0",
    "tenacity>=9.1.4",
    "tqdm>=4.68.2",
]
